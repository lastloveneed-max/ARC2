<!DOCTYPE html>

<body class="bg-[#0b0f19] text-gray-100 min-h-screen selection:bg-purple-500 selection:text-white">

                    <div class="p-3 bg-purple-500/10 rounded-xl text-purple-400 group-hover:scale-110 transition-transform duration-300">

                    <span class="text-xs font-mono text-gray-500">01 / FEATURE</span>
                </div>

                <p class="text-gray-400 text-sm mb-6 leading-relaxed">Stream real-time crypto
